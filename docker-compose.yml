# Enterprise AI Knowledge Copilot — local deployment.
# Services: api (FastAPI), ui (Streamlit), postgres (metadata), qdrant (vectors).
# Mock mode is the default; set APP_MODE=real + OPENAI_API_KEY in .env for real providers.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-mock}
      LOG_JSON: "true"
      DATABASE_URL: postgresql+asyncpg://copilot:copilot@postgres:5432/copilot
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      DEMO_API_KEY: ${DEMO_API_KEY:-changeme-dev-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    environment:
      COPILOT_API_URL: http://api:8000
      COPILOT_API_KEY: ${DEMO_API_KEY:-changeme-dev-key}
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
