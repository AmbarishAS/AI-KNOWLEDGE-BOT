[project]
name = "ai-knowledge-copilot"
version = "0.1.0"
description = "Enterprise AI Knowledge Copilot — RAG + Agents + MCP, mock-first and Dockerized"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.18",
    "SQLAlchemy==2.0.36",
    "greenlet==3.1.1",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "numpy==2.1.3",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "tiktoken==0.8.0",
    # --- Previously optional (prod / agents / mcp / ui / eval / observability)
    "asyncpg==0.30.0",
    "qdrant-client==1.12.1",
    "rank-bm25==0.2.2",
    "langgraph==0.2.53",
    "langchain-core==0.3.21",
    "mcp==1.1.2",
    "gradio==5.9.1",
    "ragas==0.2.6",
    "opentelemetry-sdk==1.28.2",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
pytest-cov = "6.0.0"
ruff = "0.8.2"
mypy = "1.13.0"
types-requests = "2.32.0.20241016"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
ignore = ["B008"]  # FastAPI uses function calls (Depends()) in defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
exclude = ["tests", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/mcp/*", "ui/*"]

